<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pepe útja – egy pizza kalandja</title>
<style>
  html,body{margin:0;height:100%;background:#140d09;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;
    font-family:"Comic Sans MS","Chalkboard SE","Marker Felt","Trebuchet MS",system-ui,sans-serif}
  #stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;user-select:none}
  canvas{width:100%;height:100%;display:block;background:#000}
  #ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2.4vmin;background:radial-gradient(circle at 50% 50%,rgba(30,16,8,.55),rgba(20,12,8,.9));transition:opacity .45s}
  #ov.hide{opacity:0;pointer-events:none}
  #ov h1{margin:0;color:#ffe7a8;font-size:clamp(30px,8vmin,84px);letter-spacing:2px;font-weight:900;
    -webkit-text-stroke:3px #3a2216;paint-order:stroke fill;text-shadow:0 6px 0 #3a2216;transform:rotate(-3deg)}
  #ov p{margin:0;color:#ffd9a0;font-size:clamp(13px,2.6vmin,24px);text-shadow:0 2px 0 #3a2216;text-align:center;padding:0 16px}
  #play{width:clamp(84px,17vmin,160px);aspect-ratio:1;border-radius:50%;border:6px solid #3a2216;background:#ff7a2f;
    box-shadow:0 9px 0 #3a2216,0 0 40px rgba(255,140,60,.55);cursor:pointer;display:grid;place-items:center;
    transition:transform .15s;animation:bob 1.6s ease-in-out infinite}
  #play:hover{transform:scale(1.08) rotate(-5deg)}
  #play:active{transform:translateY(6px)}
  #play svg{width:44%;margin-left:9%}
  @keyframes bob{50%{translate:0 -6px}}
  #hint{position:absolute;right:12px;bottom:8px;color:rgba(255,230,190,.55);font-size:clamp(10px,1.6vmin,14px);pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="ov">
    <h1 id="ttl">PEPE ÚTJA</h1>
    <p id="sub">Egy pizza kalandja a kemencétől az ajtóig · 30 másodperc · hanggal</p>
    <button id="play" aria-label="Lejátszás">
      <svg viewBox="0 0 100 100"><path d="M18 8 L92 50 L18 92 Z" fill="#fff4d6" stroke="#3a2216" stroke-width="9" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div id="hint">kattintás / szóköz: szünet</div>
</div>
<script>
"use strict";
/* ============================================================
   PEPE ÚTJA – minden alak, szín, mozgás és hang kódból készül.
   ============================================================ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=1280, H=720, DUR=30, TAU=Math.PI*2, OUT='#3a2216';
const bufA=document.createElement('canvas'), bufB=document.createElement('canvas');
let SC=1;

/* ---------- segédfüggvények ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,v)=>clamp((v-a)/(b-a));
const E={
  lin:t=>t,
  inOut:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  out:t=>1-Math.pow(1-t,3),
  in:t=>t*t*t,
  back:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
  elastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*TAU/3)+1,
};
const tw=(t,a,b,e=E.inOut)=>e(inv(a,b,t));
const bell=(t,a,b)=>{const p=inv(a,b,t);return Math.sin(p*Math.PI)};
function rng(s){return()=>(s=(s*16807)%2147483647,(s-1)/2147483646)}
const _hc={};
const hex=h=>_hc[h]||(_hc[h]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)));
const mixC=(a,b,t)=>{const A=hex(a),B=hex(b);t=clamp(t);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t))})`};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function ell(c,x,y,rx,ry,rot=0){c.beginPath();c.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,TAU)}
function circ(c,x,y,r){ell(c,x,y,r,r)}
function fs(c,fill,stroke=OUT,lw=5){if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.lineJoin='round';c.lineCap='round';c.stroke()}}
function poly(c,pts){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath()}
function line(c,x1,y1,x2,y2,col=OUT,lw=5){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.stroke()}
// kamera: a világ (x,y) pontját a kép közepére teszi, z nagyítással
function cam(c,x,y,z=1,r=0){c.translate(W/2,H/2);c.scale(z,z);c.rotate(r);c.translate(-x,-y)}
// kézikamera-remegés
const shake=(t,a=1)=>[Math.sin(t*1.7)*2*a+Math.sin(t*4.3)*a,Math.cos(t*1.3)*1.6*a+Math.sin(t*3.7)*a];

/* ============================================================
   HANG – Web Audio, minden hang szintetizálva
   ============================================================ */
let AC=null, MASTER=null, VERB=null, NOISE=null, RUN=null, T0=0;
function audioInit(){
  if(AC) return;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  AC=new C();
  MASTER=AC.createGain(); MASTER.gain.value=.9;
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-16; comp.knee.value=10; comp.ratio.value=4;
  MASTER.connect(comp); comp.connect(AC.destination);
  const n=AC.sampleRate*2; NOISE=AC.createBuffer(1,n,AC.sampleRate);
  const d=NOISE.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  VERB=AC.createConvolver();
  const L=AC.sampleRate*1.8|0, ir=AC.createBuffer(2,L,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const e=ir.getChannelData(ch);for(let i=0;i<L;i++) e[i]=(Math.random()*2-1)*Math.pow(1-i/L,3.2)}
  VERB.buffer=ir; VERB.connect(MASTER);
}
function newRun(){
  if(RUN){const o=RUN;o.dry.gain.setTargetAtTime(0,AC.currentTime,.04);o.wet.gain.setTargetAtTime(0,AC.currentTime,.04);
    setTimeout(()=>{o.dry.disconnect();o.wet.disconnect()},500)}
  RUN={dry:AC.createGain(),wet:AC.createGain()};
  RUN.wet.gain.value=.35; RUN.dry.connect(MASTER); RUN.wet.connect(VERB);
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,peak,r){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+r)}
function route(g,dest,wet){g.connect(dest||RUN.dry);if(wet){const s=AC.createGain();s.gain.value=wet;g.connect(s);s.connect(RUN.wet)}}
function tone(t,{type='sine',f=440,f2=0,ft=0,dur=.3,vol=.3,a=.005,dest=null,wet=0,filt=null}={}){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+(ft||dur));
  env(g,t,a,vol,dur);
  let n=o;
  if(filt){const fl=AC.createBiquadFilter();fl.type=filt[0];fl.frequency.value=filt[1];fl.Q.value=filt[2]||.7;o.connect(fl);n=fl}
  n.connect(g); route(g,dest,wet);
  o.start(t); o.stop(t+a+dur+.05); return o;
}
function hiss(t,{dur=.3,vol=.3,a=.005,type='bandpass',f=1000,f2=0,q=1,dest=null,wet=0}={}){
  const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true;
  const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t);
  if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+a+dur); fl.Q.value=q;
  const g=AC.createGain(); env(g,t,a,vol,dur);
  s.connect(fl); fl.connect(g); route(g,dest,wet);
  s.start(t,Math.random()*1.5); s.stop(t+a+dur+.05); return g;
}
function vibrato(o,t,d,rate,depth){const l=AC.createOscillator(),g=AC.createGain();l.frequency.value=rate;g.gain.value=depth;l.connect(g);g.connect(o.frequency);l.start(t);l.stop(t+d)}

// "beszéd": formánsszűrt szótagok (rajzfilmes makogás)
const VOW=[[730,1090],[270,2290],[530,1840],[570,840],[300,870],[660,1700]];
function syl(t,f,d,vol){
  const o=AC.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(f,t); o.frequency.linearRampToValueAtTime(f*(.9+Math.random()*.25),t+d);
  const g=AC.createGain(); env(g,t,.012,vol,d);
  const k=f>380?1.3:1;
  VOW[Math.random()*VOW.length|0].forEach(ff=>{const b=AC.createBiquadFilter();b.type='bandpass';b.frequency.value=ff*k;b.Q.value=5;o.connect(b);b.connect(g)});
  route(g,null,.15); o.start(t); o.stop(t+d+.05);
}
function talk(t,text,f0){
  const n=Math.max(3,Math.round(text.replace(/[^A-Za-zÀ-ž]/g,'').length/2.1));
  for(let i=0;i<n;i++){
    const last=i===n-1, f=f0*(1+.18*Math.sin(i*1.9)+(last?.22:0))*(.94+Math.random()*.12);
    syl(t+i*.09,f,last?.14:.075,.5);
  }
}

const SFX={
  thud:t=>{tone(t,{f:160,f2:42,dur:.35,vol:.9});hiss(t,{dur:.14,vol:.35,type:'lowpass',f:900})},
  pop:(t,p=1)=>tone(t,{f:480*p,f2:1150*p,ft:.06,dur:.1,vol:.4}),
  plop:(t,p=1)=>{tone(t,{f:240*p,f2:640*p,ft:.07,dur:.13,vol:.45,wet:.2});hiss(t,{dur:.04,vol:.12,f:2600,q:2})},
  boing:(t,p=1)=>{const o=tone(t,{type:'triangle',f:170*p,f2:560*p,ft:.22,dur:.5,vol:.4,wet:.2});vibrato(o,t,.6,13,35*p)},
  whoosh:(t,d=.5)=>hiss(t,{dur:d*.55,a:d*.45,vol:.45,f:280,f2:2600,q:1.2}),
  zip:(t,up=true)=>tone(t,{type:'triangle',f:up?280:1300,f2:up?1300:220,dur:.5,vol:.18,wet:.3}),
  roll:(t,d)=>{hiss(t,{dur:d,a:.12,vol:.2,type:'lowpass',f:420});for(let i=0;i<4;i++)hiss(t+i*d/4,{dur:d/4,a:d/8,vol:.12,f:700,q:2})},
  squish:t=>{for(let i=0;i<6;i++)tone(t+i*.11,{f:230-i*12,f2:110,dur:.1,vol:.2,filt:['lowpass',700]})},
  sprinkle:(t,d=.6)=>{for(let i=0;i<26;i++)tone(t+Math.random()*d,{f:2400+Math.random()*3200,dur:.035,vol:.06})},
  sizzle:(t,d)=>hiss(t,{dur:d,a:.5,vol:.12,type:'highpass',f:4200}),
  fire:(t,d)=>{hiss(t,{dur:d-.6,a:.6,vol:.22,type:'lowpass',f:320});
    for(let i=0;i<d*13;i++)hiss(t+Math.random()*d,{dur:.015+Math.random()*.03,vol:.1+Math.random()*.18,type:'highpass',f:1600})},
  ding:t=>[1318.5,2637,3951].forEach((f,i)=>tone(t,{f,dur:1.7/(i+1),vol:.26/(i+1),wet:.6})),
  scrape:(t,d=.6)=>hiss(t,{dur:d,a:.08,vol:.16,f:850,q:3}),
  thump:t=>{tone(t,{f:120,f2:48,dur:.25,vol:.75});hiss(t,{dur:.07,vol:.3,type:'lowpass',f:1300})},
  stamp:t=>{hiss(t,{dur:.05,vol:.5,type:'highpass',f:2200});tone(t,{f:230,f2:70,dur:.22,vol:.65})},
  swish:t=>hiss(t,{dur:.22,a:.08,vol:.3,f:1900,f2:500,q:.8}),
  honk:t=>[0,.27].forEach(o=>[392,494].forEach(f=>tone(t+o,{type:'square',f,dur:.19,a:.01,vol:.11,filt:['lowpass',1900]}))),
  squeak:t=>tone(t,{type:'sawtooth',f:1500,f2:900,dur:.38,vol:.07,filt:['bandpass',1500,4]}),
  step:t=>{tone(t,{f:95,f2:50,dur:.08,vol:.3});hiss(t,{dur:.05,vol:.08,type:'lowpass',f:700})},
  knock:t=>{tone(t,{f:200,f2:110,dur:.12,vol:.85,filt:['lowpass',650]});hiss(t,{dur:.06,vol:.5,f:520,q:1.5})},
  creak:t=>{const o=tone(t,{type:'sawtooth',f:170,f2:430,ft:.75,dur:.8,vol:.09,a:.05,filt:['bandpass',950,6]});vibrato(o,t,.9,23,30)},
  flap:t=>{for(let i=0;i<9;i++)hiss(t+i*.065,{dur:.045,vol:.14,f:1300,q:1})},
  sparkle:t=>[0,4,7,12,16,19,24].forEach((s,i)=>tone(t+i*.045,{f:mtof(84+s),dur:.35,vol:.075,wet:.7})),
  engine:(t,d)=>{
    const o=AC.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(46,t); o.frequency.linearRampToValueAtTime(74,t+1.4);
    o.frequency.setValueAtTime(74,t+2.55); o.frequency.linearRampToValueAtTime(92,t+2.75); o.frequency.linearRampToValueAtTime(74,t+3.3);
    o.frequency.setValueAtTime(74,t+d-.8); o.frequency.linearRampToValueAtTime(38,t+d);
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650;
    const am=AC.createGain(); am.gain.value=.6;
    const l=AC.createOscillator(); l.type='square'; l.frequency.setValueAtTime(15,t); l.frequency.linearRampToValueAtTime(24,t+1.4);
    l.frequency.setValueAtTime(24,t+d-.8); l.frequency.linearRampToValueAtTime(10,t+d);
    const lg=AC.createGain(); lg.gain.value=.38; l.connect(lg); lg.connect(am.gain);
    const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.17,t+.35);
    g.gain.setValueAtTime(.17,t+d-.5); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(lp); lp.connect(am); am.connect(g); route(g);
    o.start(t); l.start(t); o.stop(t+d+.1); l.stop(t+d+.1);
  },
};

/* ---------- zene: vidám 120 BPM-es dallam (C – Am – F – G) ---------- */
function music(T){
  const M=AC.createGain(); M.gain.value=.5; route(M,null,.25);
  const B=.5;
  const P=[[36,[60,64,67]],[33,[60,64,69]],[29,[60,65,69]],[31,[59,62,67]]];
  const MEL=[[0,76,1],[1,79,.5],[1.5,76,.5],[2,72,1],[3,74,1],[4,76,1.5],[5.5,72,.5],[6,69,2],
    [8,77,1],[9,81,.5],[9.5,77,.5],[10,72,1],[11,74,.5],[11.5,76,.5],[12,74,1],[13,71,.5],[13.5,67,.5],[14,74,1.5]];
  const kick=t=>tone(t,{f:125,f2:42,ft:.12,dur:.22,vol:.75,dest:M});
  const snare=t=>{hiss(t,{dur:.12,vol:.22,type:'highpass',f:1500,dest:M});tone(t,{type:'triangle',f:210,f2:150,dur:.08,vol:.2,dest:M})};
  const hat=t=>hiss(t,{dur:.035,vol:.07,type:'highpass',f:7200,dest:M});
  for(let bar=0;bar<14;bar++){
    const t=T+bar*4*B, [bn,ch]=P[bar%4], busy=bar>=7&&bar<11;
    [[0,0,.9],[1,7,.4],[1.5,12,.4],[2,0,.9],[3,7,.4],[3.5,12,.4]].forEach(([o,n,d])=>
      tone(t+o*B,{type:'triangle',f:mtof(bn+12+n),dur:d*B,vol:.42,a:.01,dest:M}));
    [.5,1.5,2.5,3.5].forEach(o=>ch.forEach(n=>tone(t+o*B,{type:'square',f:mtof(n),dur:.15,vol:.032,filt:['lowpass',1700],dest:M})));
    if(bar>0){kick(t);kick(t+2*B);snare(t+B);snare(t+3*B);if(busy){kick(t+1.5*B);kick(t+3.5*B)}}
    for(let h=0;h<8;h++) if(busy||h%2) hat(t+h*B/2);
  }
  for(let cyc=0;cyc<4;cyc++) MEL.forEach(([o,n,d])=>{
    const b=cyc*16+o; if(b>=55) return;
    const tt=T+b*B, up=cyc===2?12:0;
    tone(tt,{type:'square',f:mtof(n+up),dur:d*B*.85,vol:.05,a:.01,filt:['lowpass',2600],dest:M});
    tone(tt,{type:'triangle',f:mtof(n+up),dur:d*B*.9,vol:.09,a:.01,dest:M});
  });
  // záróakkord
  const te=T+28;
  kick(te); hiss(te,{dur:1.6,vol:.12,type:'highpass',f:5000,dest:M});
  [48,60,64,67,72,76].forEach(n=>tone(te,{type:'triangle',f:mtof(n),dur:1.9,vol:.11,a:.02,dest:M,wet:.4}));
  [72,76,79,84].forEach((n,i)=>tone(te+.1+i*.09,{f:mtof(n+12),dur:.6,vol:.05,wet:.6}));
}

/* ---------- a teljes hangsáv időzítése (abszolút másodpercek) ---------- */
function scheduleAll(T){
  music(T);
  const s=(at,fn,...a)=>fn(T+at,...a);
  // 1. jelenet – tészta
  s(.6,SFX.thud); s(1.05,SFX.roll,1.15); s(2.45,SFX.squish); s(3.3,SFX.sprinkle,.6);
  for(let k=0;k<7;k++) s(3.97+k*.12,SFX.plop,1+k*.08);
  s(4.85,SFX.pop); s(5.05,SFX.boing); s(5.25,talk,'Szia! Pepe vagyok!',520);
  s(5.65,SFX.whoosh,.7);
  // 2. jelenet – kemence
  s(6.0,SFX.fire,4.9); s(6.3,SFX.scrape,1.4); s(6.65,talk,'Hű, kicsit meleg van itt!',540);
  s(8.0,SFX.sizzle,1.9); s(9.85,SFX.scrape,.5); s(10.05,SFX.ding); s(10.1,SFX.sparkle);
  s(10.55,SFX.zip,true);
  // 3. jelenet – doboz
  s(11.3,talk,'Hopp, be a dobozba!',560); s(11.6,SFX.boing,1.2); s(12.2,SFX.thump);
  s(12.9,SFX.swish); s(13.3,SFX.thump); s(13.5,SFX.stamp); s(14.2,SFX.whoosh,.7);
  // 4. jelenet – futár
  s(14.4,SFX.engine,7.8); s(17.0,SFX.thump); s(17.05,SFX.boing,.8); s(17.2,talk,'Hoppá!',600);
  s(18.9,SFX.honk); s(19.1,SFX.flap);
  // 5. jelenet – ajtó
  s(22.05,SFX.squeak); [22.35,22.63,22.91,23.19,23.47].forEach(x=>s(x,SFX.step));
  s(23.8,SFX.knock); s(24.05,SFX.knock); s(24.3,SFX.knock); s(24.5,SFX.creak); s(24.85,SFX.whoosh,.7);
  // 6. jelenet – boldog vásárló
  s(25.85,SFX.swish); s(26.2,SFX.boing,1.1); s(26.25,SFX.sparkle); s(26.35,talk,'Ta-dam!',600);
  s(27.6,talk,'Mmm... pont időben!',235); s(28.4,SFX.pop,1.4); s(28.45,SFX.sparkle); s(28.9,SFX.zip,false);
}

/* ============================================================
   SZEREPLŐK ÉS KELLÉKEK
   ============================================================ */
const FONT='"Comic Sans MS","Chalkboard SE","Marker Felt","Trebuchet MS",sans-serif';
const PEP=[[-.42,-.5],[.38,-.52],[-.66,.16],[.66,.16],[-.34,.56],[.34,.56],[0,-.66]];
const SPOTS=[[-.2,-.36,.08],[.16,.32,.07],[.52,-.22,.06],[-.56,-.08,.05],[.06,-.16,.05],[-.12,.68,.05]];

function wobble(c,r,amp,f,ph=0,n=48){
  c.beginPath();
  for(let i=0;i<=n;i++){const a=i/n*TAU,q=r*(1+amp*Math.sin(a*f+ph)+amp*.5*Math.sin(a*(f*2+1)+ph*1.7));
    i?c.lineTo(Math.cos(a)*q,Math.sin(a)*q):c.moveTo(Math.cos(a)*q,Math.sin(a)*q)}
  c.closePath();
}
// körvonalazott végtag (vastag vonal kontúrral)
function limb(c,pts,col,w){
  for(const [cl,lw] of [[OUT,w+8],[col,w]]){
    c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
    c.strokeStyle=cl; c.lineWidth=lw; c.lineCap='round'; c.lineJoin='round'; c.stroke();
  }
}
function shadow(c,x,y,w,a=.22){c.save();c.globalAlpha=a;ell(c,x,y,w,w*.17);c.fillStyle='#000';c.fill();c.restore()}
function sparkle(c,x,y,s,col='#fff6c8'){
  c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?s*.3:s;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}
  c.closePath();fs(c,col,OUT,2.5);
}
function heart(c,x,y,s){
  c.beginPath();c.moveTo(x,y+s*.9);
  c.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.7,y-s*1.2,x,y-s*.45);
  c.bezierCurveTo(x+s*.7,y-s*1.2,x+s*1.5,y-s*.1,x,y+s*.9);c.closePath();
}
function drop(c,x,y,r){
  c.beginPath();c.moveTo(x,y-r*1.9);
  c.bezierCurveTo(x+r*.5,y-r,x+r*1.1,y-r*.3,x+r,y+r*.2);
  c.arc(x,y+r*.2,r,0,Math.PI);
  c.bezierCurveTo(x-r*1.1,y-r*.3,x-r*.5,y-r,x,y-r*1.9);
  fs(c,'#9adcff',OUT,3);
}
function steam(c,x,y,t,n=3,h=120,a=.55,gap=28){
  c.save();c.lineCap='round';
  for(let i=0;i<n;i++){
    const ph=(t*.7+i/n)%1; c.globalAlpha=a*Math.sin(ph*Math.PI); c.beginPath();
    const bx=x+(i-(n-1)/2)*gap;
    for(let k=0;k<=12;k++){const yy=y-ph*h*.6-k*h/24,xx=bx+Math.sin(k*.6+t*3+i*2)*8;k?c.lineTo(xx,yy):c.moveTo(xx,yy)}
    c.strokeStyle='#fff';c.lineWidth=7;c.stroke();
  }
  c.restore();
}
// képregényes hangutánzó felirat csillagban
function burst(c,x,y,txt,p,size=46,fill='#ffd23f',tcol='#e8412c'){
  if(p<=0||p>=1) return;
  const s=E.back(inv(0,.2,p))*(1-E.in(inv(.8,1,p))); if(s<=.01) return;
  c.save(); c.translate(x,y); c.rotate(-.12+Math.sin(p*25)*.04); c.scale(s,s);
  c.font=`900 ${size}px ${FONT}`; c.textAlign='center'; c.textBaseline='middle';
  const w=c.measureText(txt).width, rx=w*.62+34, ry=size*1.2, n=14;
  c.beginPath();
  for(let i=0;i<n*2;i++){const a=i/(n*2)*TAU,k=i%2?.74:1;c.lineTo(Math.cos(a)*rx*k,Math.sin(a)*ry*k)}
  c.closePath(); fs(c,fill,OUT,5);
  c.lineWidth=9; c.strokeStyle=OUT; c.lineJoin='round'; c.strokeText(txt,0,3);
  c.fillStyle=tcol; c.fillText(txt,0,3);
  c.restore();
}

/* ---------- Pepe, a pizza ---------- */
function eyeball(c,x,y,r,bl,lk){
  const ry=r*1.18*(1-bl*.9);
  ell(c,x,y,r,ry); fs(c,'#fff',OUT,4);
  if(bl<.6){
    c.save(); ell(c,x,y,r,ry); c.clip();
    const px=x+lk[0]*r*.38, py=y+lk[1]*r*.38;
    circ(c,px,py,r*.56); fs(c,'#2a1810',null);
    circ(c,px+r*.2,py-r*.22,r*.18); fs(c,'#fff',null);
    c.restore();
  }
}
function drawFace(c,R,o){
  const lk=o.look||[0,0], bl=o.blink||0, mood=o.mood||'smile';
  c.globalAlpha=.45;
  [-1,1].forEach(s=>{ell(c,s*R*.47,R*.12,R*.12,R*.07);fs(c,'#ff7f8a',null)});
  c.globalAlpha=1;
  const er=R*.15;
  [-1,1].forEach(s=>{
    const ex=s*R*.28, ey=-R*.14;
    if(mood==='calm'||(o.wink&&s===1)){c.beginPath();c.arc(ex,ey+er*.4,er*.8,Math.PI*1.1,Math.PI*1.9);fs(c,null,OUT,5);return}
    eyeball(c,ex,ey,er,bl,lk);
  });
  if(o.brow){
    [-1,1].forEach(s=>{
      const tilt=o.brow==='worry'?s*.38:o.brow==='up'?0:-s*.25;
      c.save(); c.translate(s*R*.28,-R*(o.brow==='up'?.44:.37)); c.rotate(tilt);
      line(c,-er*.85,0,er*.85,0,OUT,5); c.restore();
    });
  }
  const my=R*.22, open=o.open??.5;
  if(mood==='worried'){
    c.beginPath();
    for(let i=0;i<=16;i++){const xx=-R*.2+i*R*.4/16,yy=my+R*.06+Math.sin(i*1.25)*R*.03;i?c.lineTo(xx,yy):c.moveTo(xx,yy)}
    fs(c,null,OUT,5);
  } else if(mood==='o'){
    ell(c,0,my+R*.08,R*.09,R*.11*(.6+open*.6)); fs(c,'#6e1b12',OUT,4);
  } else if(mood==='calm'){
    c.beginPath(); c.arc(0,my-R*.04,R*.16,.3,Math.PI-.3); fs(c,null,OUT,5);
  } else {
    const w=R*(mood==='grin'?.3:.22), h=R*lerp(.07,.28,open)*(mood==='grin'?1.25:1);
    const mp=()=>{c.beginPath();c.moveTo(-w,my);c.quadraticCurveTo(0,my+h*2,w,my);c.quadraticCurveTo(0,my+h*.25,-w,my);c.closePath()};
    mp(); fs(c,'#6e1b12',null);
    c.save(); mp(); c.clip(); ell(c,0,my+h*1.3,w*.55,h*.55); fs(c,'#ff6f6f',null); c.restore();
    mp(); fs(c,null,OUT,5);
  }
}
/* o: flat, bake, sauce, cheese, pep, face, mood, open, blink, look, wink, brow,
      arms, aL, aR, legs, step, stepAmt, sweat, sweatT, sx, sy, rot */
function drawPizza(c,x,y,R,o={}){
  const flat=o.flat??1, bake=o.bake??0, sauce=o.sauce??1, cheese=o.cheese??1, pep=o.pep??7,
        sx=o.sx??1, sy=o.sy??1, legs=o.legs??0, arms=o.arms??0, fy=sy*flat;
  c.save(); c.translate(x,y); c.rotate(o.rot||0);
  const S=fn=>{c.save();c.scale(sx,fy);fn();c.restore()};
  if(legs>0){
    const L=R*.42*legs, by=R*fy*.9;
    [-1,1].forEach(s=>{
      const sw=Math.sin((o.step||0)+(s>0?Math.PI:0))*(o.stepAmt??0);
      const hx=s*R*.3*sx, fx=hx+Math.sin(sw)*L, fyy=by+Math.cos(sw)*L;
      line(c,hx,by,fx,fyy,OUT,7); ell(c,fx+s*6,fyy+2,13*legs,8*legs); fs(c,'#5a3322',OUT,4);
    });
  }
  if(arms>0){
    [[-1,o.aL??.7],[1,o.aR??.7]].forEach(([s,a])=>{
      const shx=s*R*.9*sx, shy=R*fy*.08, L=R*.5*arms;
      const hx=shx+s*Math.cos(a)*L, hy=shy+Math.sin(a)*L;
      line(c,shx,shy,hx,hy,OUT,7); circ(c,hx,hy,R*.13*arms); fs(c,'#fff',OUT,4);
    });
  }
  const dough=mixC('#f6e2b6','#d88d3e',bake), doughD=mixC('#e2c48e','#a85f1f',bake);
  S(()=>circ(c,0,0,R)); fs(c,dough,OUT,5);
  S(()=>{c.beginPath();c.arc(0,0,R*.9,3.5,4.5)}); fs(c,null,'rgba(255,255,255,.55)',5);
  if(sauce>0){S(()=>wobble(c,R*.84*sauce,.025,5,1)); fs(c,mixC('#e2452c','#b8301a',bake),doughD,3)}
  if(cheese>0){
    S(()=>wobble(c,R*.76*cheese,.05,7,2)); fs(c,mixC('#ffe38a','#f3b640',bake),null);
    if(bake>.3){c.globalAlpha=Math.min(1,(bake-.3)*1.3)*cheese;
      SPOTS.forEach(([a,b,r])=>{S(()=>ell(c,a*R,b*R,r*R,r*R*.8));fs(c,'#c87a2c',null)});c.globalAlpha=1}
  }
  PEP.forEach(([a,b],i)=>{
    const k=clamp(pep-i); if(k<=0) return; const s=E.back(k);
    S(()=>circ(c,a*R,b*R,R*.13*s)); fs(c,mixC('#c63a2b','#90251a',bake),OUT,3);
    S(()=>circ(c,a*R-R*.035*s,b*R-R*.03*s,R*.028*s)); fs(c,'rgba(255,255,255,.35)',null);
    S(()=>circ(c,a*R+R*.045*s,b*R+R*.04*s,R*.022*s)); fs(c,'rgba(0,0,0,.25)',null);
  });
  const face=o.face??0;
  if(face>0){
    c.save(); c.scale(sx*face,sy*Math.max(flat,.7)*face); c.translate(0,-R*.03);
    drawFace(c,R,o); c.restore();
  }
  if(o.sweat>0){
    const ph=(o.sweatT||0)%1;
    c.globalAlpha=o.sweat*(1-ph*.7); drop(c,R*.66,-R*.4+ph*R*.35,R*.08); c.globalAlpha=1;
  }
  c.restore();
}

/* ---------- pizzásdoboz (ferde axonometria) ----------
   lid: 0 = függőlegesen nyitva, PI/2 = csukva */
function drawBox(c,x,y,o={}){
  const Wd=o.w||300, Ht=o.h||46, D=o.d||220, th=o.lid??Math.PI/2, kx=.42, ky=.32;
  const P=(px,py,pz)=>[x-Wd/2-D*kx/2+px+pz*kx, y-py-pz*ky];
  const cb='#d9a25f', cbD='#b98144', cbIn='#efcf98', cbInD='#cfa166';
  c.save();
  if(th<1.45){
    poly(c,[P(0,0,D),P(Wd,0,D),P(Wd,Ht,D),P(0,Ht,D)]); fs(c,cbInD,OUT,4);
    poly(c,[P(0,0,0),P(Wd,0,0),P(Wd,0,D),P(0,0,D)]); fs(c,cbIn,OUT,4);
    poly(c,[P(0,0,0),P(0,0,D),P(0,Ht,D),P(0,Ht,0)]); fs(c,cbInD,OUT,4);
  }
  o.inside&&o.inside(P);
  poly(c,[P(0,0,0),P(Wd,0,0),P(Wd,Ht,0),P(0,Ht,0)]); fs(c,cb,OUT,5);
  poly(c,[P(Wd,0,0),P(Wd,0,D),P(Wd,Ht,D),P(Wd,Ht,0)]); fs(c,cbD,OUT,5);
  // felirat a doboz elején
  const fc=P(Wd/2,Ht/2,0);
  if(Ht>30){c.font=`900 ${Math.round(Ht*.48)}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';
    c.fillStyle='#c0392b';c.fillText('PEPE PIZZA',fc[0],fc[1]+2)}
  o.peekFn&&o.peekFn(P);
  const ly=Ht+D*Math.cos(th), lz=D-D*Math.sin(th);
  const q=[P(0,Ht,D),P(Wd,Ht,D),P(Wd,ly,lz),P(0,ly,lz)];
  let ar=0; for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)%4];ar+=a[0]*b[1]-b[0]*a[1]}
  poly(c,q); fs(c,ar<0?cbIn:cb,OUT,5);
  const st=o.sticker??1;
  if(ar>0&&st>0){
    // a fedél síkjára vetített logó
    const o0=q[0], ux=(q[1][0]-o0[0])/Wd, uy=(q[1][1]-o0[1])/Wd, vx=(q[3][0]-o0[0])/D, vy=(q[3][1]-o0[1])/D;
    c.save(); c.transform(ux,uy,vx,vy,o0[0],o0[1]); c.translate(Wd/2,D/2);
    const s=st; c.scale(s,s);
    circ(c,0,0,D*.36); fs(c,'#e2412f',OUT,5); circ(c,0,0,D*.29); fs(c,null,'#fff4d6',4);
    c.font=`900 ${Math.round(D*.17)}px ${FONT}`; c.textAlign='center'; c.textBaseline='middle';
    c.fillStyle='#fff4d6'; c.fillText('PEPE',0,-D*.04);
    c.font=`900 ${Math.round(D*.08)}px ${FONT}`; c.fillText('PIZZA',0,D*.13);
    c.restore();
  }
  c.restore();
}

/* ---------- robogó futárral (jobbra néz) ---------- */
const SKIN_C='#c88a5a', SKIN_U='#f2c29b';
function helmetHead(c,x,y,r,o={}){
  circ(c,x,y,r); fs(c,SKIN_C,OUT,5);
  // sisak
  c.beginPath(); c.arc(x-2,y-4,r*1.08,Math.PI*1.02,Math.PI*1.98); c.closePath(); fs(c,'#e2412f',OUT,5);
  c.beginPath(); c.arc(x-2,y-4,r*1.08,Math.PI*1.38,Math.PI*1.55); c.lineTo(x-2,y-4); c.closePath(); fs(c,'#fff4d6',null);
  c.beginPath(); c.arc(x-2,y-4,r*1.08,Math.PI*1.02,Math.PI*1.98); fs(c,null,OUT,5);
  rr(c,x-r*1.15,y-6,r*2.3,9,4); fs(c,'#b5281c',OUT,3);
  // arc
  const lx=(o.look??1)*r*.28, bl=o.blink||0;
  [-.15,.42].forEach(k=>{ell(c,x+k*r+lx*.4,y+r*.18,4.5,6.5*(1-bl*.85));fs(c,'#2a1810',null)});
  c.globalAlpha=.4; ell(c,x+r*.62,y+r*.42,7,4.5); fs(c,'#ff6b6b',null); c.globalAlpha=1;
  c.beginPath(); c.arc(x+r*.2,y+r*.48,r*.28,.2,Math.PI-.6); fs(c,null,OUT,4);
}
function drawScooter(c,x,y,o={}){
  const t=o.t||0, wr=o.wheel||0;
  c.save(); c.translate(x,y); c.rotate(o.tilt||0);
  // csomagtartó + doboz
  line(c,-150,-112,-82,-112,OUT,6);
  if(o.box!==false) drawBox(c,-118,-116,{w:110,h:24,d:80,lid:Math.PI/2-.55*(o.peek||0),sticker:1,peekFn:o.peekFn});
  // kerekek
  [-85,88].forEach(wx=>{
    circ(c,wx,-30,30); fs(c,'#2b2b33',OUT,5); circ(c,wx,-30,14); fs(c,'#c9ced6',OUT,3);
    for(let k=0;k<3;k++){const a=wr+k*TAU/3;line(c,wx,-30,wx+Math.cos(a)*13,-30+Math.sin(a)*13,OUT,3)}
  });
  // hátsó karosszéria
  c.beginPath(); c.moveTo(-132,-44); c.quadraticCurveTo(-140,-104,-72,-108); c.lineTo(8,-104);
  c.quadraticCurveTo(28,-66,38,-48); c.lineTo(-120,-40); c.closePath(); fs(c,'#5cc9b0',OUT,5);
  c.beginPath(); c.moveTo(-120,-60); c.quadraticCurveTo(-118,-90,-80,-94); fs(c,null,'rgba(255,255,255,.5)',5);
  rr(c,-44,-52,100,14,6); fs(c,'#3f9c87',OUT,4);
  // első sárvédő
  c.beginPath(); c.arc(88,-30,40,Math.PI*1.08,Math.PI*1.92); c.arc(88,-30,32,Math.PI*1.92,Math.PI*1.08,true); c.closePath();
  fs(c,'#5cc9b0',OUT,4);
  // kormányoszlop / pajzs
  c.beginPath(); c.moveTo(42,-46); c.quadraticCurveTo(58,-112,62,-156); c.lineTo(84,-156);
  c.quadraticCurveTo(92,-96,112,-62); c.quadraticCurveTo(102,-46,84,-42); c.closePath(); fs(c,'#5cc9b0',OUT,5);
  // ülés
  rr(c,-98,-124,108,22,11); fs(c,'#5a3322',OUT,4);
  // lámpa
  if(o.light){c.save();c.globalAlpha=.22*o.light;c.beginPath();c.moveTo(108,-132);c.lineTo(420,-60);c.lineTo(420,-210);c.closePath();
    c.fillStyle='#fff3b0';c.fill();c.restore()}
  circ(c,104,-132,13); fs(c,'#fff6b0',OUT,4);
  line(c,60,-160,98,-168,OUT,7);
  if(o.rider!==false){
    const b=Math.sin(t*22)*1.5+(o.bob||0);
    c.translate(0,b);
    // sál lobog
    const sc=[];for(let i=0;i<=8;i++)sc.push([-18-i*11,-212+Math.sin(t*16-i*.8)*(2+i*1.2)+i*1.5]);
    limb(c,sc,'#ffd23f',10);
    // láb
    limb(c,[[-44,-126],[12,-120],[22,-62]],'#2d3a5a',22);
    ell(c,34,-56,18,9); fs(c,'#3a2216',OUT,3);
    // törzs
    c.save(); c.translate(-30,-166); c.rotate(.32); rr(c,-26,-50,52,96,22); fs(c,'#d93a2b',OUT,5);
    rr(c,-6,-50,12,96,5); fs(c,'#fff4d6',null); c.restore();
    // kar
    limb(c,[[-8,-200],[34,-176],[86,-164]],'#d93a2b',18);
    circ(c,88,-164,11); fs(c,'#fff',OUT,4);
    helmetHead(c,8,-238,33,{blink:o.blink});
  }
  c.restore();
}

/* ---------- futár gyalog, dobozzal ---------- */
function drawCourierWalk(c,x,y,o={}){
  const ph=o.phase||0, amt=o.walk??1, kn=o.knock||0;
  c.save(); c.translate(x,y);
  const bob=-Math.abs(Math.sin(ph))*6*amt;
  // lábak
  [0,Math.PI].forEach((p,i)=>{
    const s=Math.sin(ph+p)*amt, fx=s*30, fy=-Math.max(0,Math.cos(ph+p))*10*amt;
    limb(c,[[0,-92+bob],[fx*.5+6,-48+fy*.5],[fx,fy-6]],i?'#26314d':'#2d3a5a',22);
    ell(c,fx+10,fy-4,18,9); fs(c,'#3a2216',OUT,3);
  });
  c.translate(0,bob);
  rr(c,-28,-186,56,100,24); fs(c,'#d93a2b',OUT,5); rr(c,-6,-186,12,100,5); fs(c,'#fff4d6',null);
  helmetHead(c,8,-222,33,{blink:o.blink});
  // doboz a bal karon
  drawBox(c,36,-118,{w:110,h:24,d:80,sticker:1});
  limb(c,[[-10,-170],[10,-128],[40,-112]],'#c33326',17); circ(c,42,-112,10); fs(c,'#fff',OUT,4);
  // jobb kar: kopogás
  const ka=kn>0?Math.sin(kn*Math.PI*6):0;
  const hx=kn>0?lerp(60,96,.5+.5*ka):70, hy=kn>0?-176:-130;
  limb(c,[[12,-172],[kn>0?50:44,kn>0?-170:-150],[hx,hy]],'#d93a2b',18); circ(c,hx+2,hy,11); fs(c,'#fff',OUT,4);
  c.restore();
}

/* ---------- a vásárló (szemből) ---------- */
function drawCustomer(c,x,y,o={}){
  const r=72, mood=o.mood||'curious', t=o.t||0;
  c.save(); c.translate(x,y);
  // pulóver
  c.beginPath(); c.moveTo(-60,r*.8); c.quadraticCurveTo(-210,r*1.1,-230,600); c.lineTo(230,600);
  c.quadraticCurveTo(210,r*1.1,60,r*.8); c.closePath(); fs(c,'#7d5ba6',OUT,5);
  c.beginPath(); c.moveTo(-38,r*.82); c.quadraticCurveTo(0,r*1.25,38,r*.82); fs(c,'#f4e3c3',OUT,4);
  rr(c,-22,r*.55,44,40,12); fs(c,SKIN_U,OUT,4);
  // haj hátul
  const curls=[];for(let i=0;i<15;i++){const a=Math.PI*(.88+i/14*1.24);curls.push([Math.cos(a)*r*1.02,Math.sin(a)*r*.98-6])}
  curls.forEach(([cx,cy])=>{circ(c,cx,cy,26);fs(c,'#4a2c1d',OUT,4)});
  // fülek, fej
  [-1,1].forEach(s=>{ell(c,s*r*.98,8,14,18);fs(c,SKIN_U,OUT,4)});
  circ(c,0,0,r); fs(c,SKIN_U,OUT,5);
  // frufru
  [[-46,-52,24],[-18,-64,26],[12,-66,25],[40,-55,24],[58,-34,18],[-60,-30,18]].forEach(([cx,cy,cr])=>{circ(c,cx,cy,cr);fs(c,'#4a2c1d',null)});
  // pír
  c.globalAlpha=mood==='love'?.7:.4; [-1,1].forEach(s=>{ell(c,s*r*.52,r*.3,16,10);fs(c,'#ff7f8a',null)}); c.globalAlpha=1;
  // szemek
  [-1,1].forEach(s=>{
    const ex=s*r*.36, ey=-r*.02;
    if(mood==='love'){const p=1+.15*Math.sin(t*14);c.save();c.translate(ex,ey);c.scale(p,p);heart(c,0,0,17);fs(c,'#ff3d5a',OUT,4);c.restore()}
    else eyeball(c,ex,ey,13,o.blink||0,o.look||[0,.3]);
    circ(c,ex,ey,24); fs(c,'rgba(255,255,255,.12)',OUT,4);
  });
  line(c,-r*.36+24,-r*.02,r*.36-24,-r*.02,OUT,4);
  // szemöldök
  [-1,1].forEach(s=>{c.save();c.translate(s*r*.36,-r*.42);c.rotate(mood==='curious'?-s*.12:s*.1);line(c,-12,0,12,0,OUT,5);c.restore()});
  // száj
  const my=r*.45;
  if(mood==='curious'){ell(c,0,my,10,12);fs(c,'#6e1b12',OUT,4)}
  else{const w=34,h=26*(o.open??1);c.beginPath();c.moveTo(-w,my-6);c.quadraticCurveTo(0,my+h*1.6,w,my-6);c.quadraticCurveTo(0,my+4,-w,my-6);c.closePath();
    fs(c,'#6e1b12',OUT,5)}
  c.restore();
}
function customerArms(c,x,y,pts){

    const y=-60+ct*v, xx=x+Math.sin(ct*3+ph)*30; if(y>760) return;
    c.save(); c.translate(xx,y); c.rotate(r0+ct*rs); c.scale(1,Math.cos(ct*8+ph)); rr(c,-8,-5,16,10,2); fs(c,col,null); c.restore()});
  if(t>3.2&&t<3.9) [[-1,-1],[1,-1],[1,.6]].forEach(([dx,dy],i)=>sparkle(c,640+dx*130,pzy+dy*100,20*Math.sin(inv(3.2,3.9,t)*Math.PI)));
  c.restore();
}

/* ============================================================
   FELIRATOK – rajzfilmes buborékok, betűnként „pattanó” szöveg
   ============================================================ */
const CAPS=[
  [.35,2.5,'Minden egy gombóc tésztával kezdődik...'],
  [2.6,4.7,'Egy kis szósz, sok sajt, szalámi!'],
  [5.2,6.4,'Szia! Pepe vagyok!','pizza'],
  [6.6,8.2,'Hű, kicsit meleg van itt!','pizza'],
  [8.4,10.6,'Ropogós és aranybarna!'],
  [11.25,12.6,'Hopp, be a dobozba!','pizza'],
  [12.8,14.4,'Lezárva, felmatricázva, indulás!'],
  [14.9,16.9,'Gyorsan, amíg forró!'],
  [17.15,18.3,'Hoppá!','pizza'],
  [18.6,21.3,'Tüt-tüt! Irány a 42-es ház!'],
  [22.0,23.6,'Megérkeztünk...'],
  [23.7,25.0,'Kopp-kopp!'],
  [26.3,27.4,'Ta-dam!','pizza'],
  [27.6,28.9,'Mmm... pont időben!','vevo'],
];
const CSTY={
  narr:{bg:'#fff4d6',tx:'#3a2216',st:null},
  pizza:{bg:'#ff8c2f',tx:'#fff4d6',st:OUT,tag:'PEPE',tagBg:'#ffd23f'},
  vevo:{bg:'#9b7bd0',tx:'#fff',st:OUT,tag:'ANNA',tagBg:'#ff8fb1'},
};
function caption(c,t,[a,b,txt,who='narr']){
  if(t<a||t>b) return;
  const S=CSTY[who], sIn=E.back(inv(a,a+.28,t)), sOut=1-E.in(inv(b-.22,b,t)), s=sIn*sOut;
  if(s<=.01) return;
  c.save();
  c.font=`900 38px ${FONT}`; c.textBaseline='middle'; c.textAlign='left';
  const w=c.measureText(txt).width, bw=w+64, bh=70, y=640;
  c.translate(W/2,y); c.rotate(Math.sin(t*2.6+a)*.012+(who==='pizza'?-.02:who==='vevo'?.02:0)); c.scale(s,s);
  rr(c,-bw/2+6,-bh/2+8,bw,bh,26); c.fillStyle='rgba(0,0,0,.35)'; c.fill();
  rr(c,-bw/2,-bh/2,bw,bh,26); fs(c,S.bg,OUT,6);
  if(S.tag){
    c.save(); c.translate(-bw/2+30,-bh/2-4); c.rotate(-.08);
    c.font=`900 22px ${FONT}`; const tw2=c.measureText(S.tag).width+26;
    rr(c,0,-18,tw2,32,12); fs(c,S.tagBg,OUT,4); c.fillStyle=OUT; c.fillText(S.tag,13,-1); c.restore();
  }
  // betűnként megjelenő szöveg
  const shown=(t-a)*34; let x=-w/2;
  for(let i=0;i<txt.length&&i<shown;i++){
    const ch=txt[i], cw=c.measureText(txt.slice(0,i+1)).width-c.measureText(txt.slice(0,i)).width;
    const k=E.back(clamp(shown-i,0,3)/3), yy=Math.sin(t*6+i*.5)*1.5;
    c.save(); c.translate(x+cw/2,yy+2); c.scale(k,k);
    if(S.st){c.lineWidth=7;c.strokeStyle=S.st;c.lineJoin='round';c.strokeText(ch,-cw/2,0)}
    c.fillStyle=S.tx; c.fillText(ch,-cw/2,0); c.restore();
    x+=cw;
  }
  c.restore();
}

/* ============================================================
   VÁGÓASZTAL – jelenetek, áttűnések, végefőcím
   ============================================================ */
const SCENES=[[0,sceneDough],[6,sceneOven],[11,sceneBox],[14.6,sceneRide],[21.6,sceneDoor],[25.2,sceneCustomer]];
const TRANS=[[6,.7,'whip'],[11,.9,'iris'],[14.6,.7,'whip'],[21.6,.9,'fade'],[25.2,.8,'zoom']];
function drawScene(c,i,t){c.save();c.setTransform(SC,0,0,SC,0,0);SCENES[i][1](c,t-SCENES[i][0]);c.restore()}
function speedLines(c,a){
  c.save(); c.globalAlpha=a*.6; const r=rng(77);
  for(let i=0;i<22;i++){const y=r()*H, x=r()*W, l=200+r()*400; line(c,x,y,x+l,y,'#fff',3+r()*5)}
  c.restore();
}
function render(t,poster=false){
  const w=cv.width, h=cv.height;
  ctx.setTransform(1,0,0,1,0,0);
  let tr=-1; TRANS.forEach((q,i)=>{if(t>=q[0]-q[1]/2&&t<q[0]+q[1]/2)tr=i});
  if(tr<0){let i=0;SCENES.forEach((s,k)=>{if(t>=s[0])i=k});drawScene(ctx,i,t)}
  else{
    const [at,du,type]=TRANS[tr], p=(t-(at-du/2))/du, e=E.inOut(p);
    drawScene(bufA.getContext('2d'),tr,t); drawScene(bufB.getContext('2d'),tr+1,t);
    ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
    if(type==='whip'){
      ctx.drawImage(bufA,-e*w,0); ctx.drawImage(bufB,(1-e)*w,0);
      ctx.setTransform(SC,0,0,SC,0,0); speedLines(ctx,Math.sin(p*Math.PI));
    } else if(type==='iris'){
      ctx.drawImage(bufA,0,0);
      const r=e*Math.hypot(w,h)*.62;
      ctx.save(); ctx.beginPath(); ctx.arc(w/2,h*.54,r,0,TAU); ctx.clip(); ctx.drawImage(bufB,0,0); ctx.restore();
      ctx.beginPath(); ctx.arc(w/2,h*.54,r,0,TAU); ctx.strokeStyle='#ffd23f'; ctx.lineWidth=10*SC; ctx.stroke();
    } else if(type==='fade'){
      ctx.drawImage(bufA,0,0); ctx.globalAlpha=e; ctx.drawImage(bufB,0,0); ctx.globalAlpha=1;
    } else {
      const cx=w*.53, cy=h*.57, s=1+e*1.8, s2=1.3-.3*e;
      ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s); ctx.translate(-cx,-cy); ctx.drawImage(bufA,0,0); ctx.restore();
      ctx.save(); ctx.globalAlpha=e; ctx.translate(w/2,h/2); ctx.scale(s2,s2); ctx.translate(-w/2,-h/2); ctx.drawImage(bufB,0,0); ctx.restore();
    }
  }
  ctx.setTransform(SC,0,0,SC,0,0);
  // végefőcím: írisz Pepe körül
  if(t>28.9){
    const e=E.inOut(inv(28.9,29.45,t)), r=lerp(900,150,e);
    ctx.beginPath(); ctx.rect(0,0,W,H); ctx.arc(640,390,r,0,TAU,true); ctx.fillStyle='#140d09'; ctx.fill();
    ctx.beginPath(); ctx.arc(640,390,r,0,TAU); ctx.strokeStyle='#ffd23f'; ctx.lineWidth=10; ctx.stroke();
    const k=E.back(inv(29.25,29.6,t));
    if(k>0){
      ctx.save(); ctx.translate(640,620); ctx.rotate(-.04); ctx.scale(k,k);
      ctx.font=`900 74px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=12; ctx.strokeStyle=OUT; ctx.lineJoin='round'; ctx.strokeText('VÉGE',0,0);
      ctx.fillStyle='#ffd23f'; ctx.fillText('VÉGE',0,0); ctx.restore();
      ctx.save(); ctx.globalAlpha=clamp(k); ctx.font=`900 30px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#ffe7a8'; ctx.fillText('Pepe Pizza – forrón, szeretettel',640,150); ctx.restore();
    }
  }
  // vignetta
  const vg=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(20,10,5,.45)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  if(poster) return;
  CAPS.forEach(q=>caption(ctx,t,q));
  ctx.fillStyle='rgba(255,140,47,.85)'; ctx.fillRect(0,H-5,W*clamp(t/DUR),5);
  if(paused){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);
    [-28,8].forEach(dx=>{rr(ctx,W/2+dx,H/2-40,20,80,6);fs(ctx,'#fff4d6',OUT,5)})}
}

/* ============================================================
   LEJÁTSZÁS
   ============================================================ */
const ov=document.getElementById('ov'), playBtn=document.getElementById('play');
let running=false, paused=false, started=false, clock=0;
function now(){return AC?AC.currentTime-T0:performance.now()/1000-T0}
function start(){
  audioInit();
  if(AC){if(AC.state!=='running')AC.resume(); newRun(); T0=AC.currentTime+.12; scheduleAll(T0)}
  else T0=performance.now()/1000+.12;
  running=true; paused=false; started=true; ov.classList.add('hide');
  requestAnimationFrame(loop);
}
function loop(){
  if(!running) return;
  clock=Math.max(0,now());
  if(clock>=DUR){
    clock=DUR; render(DUR-.001); running=false;
    document.getElementById('ttl').textContent='Még egyszer?';
    document.getElementById('sub').textContent='Pepe útja · 30 másodperc · minden kódból rajzolva és szintetizálva';
    playBtn.setAttribute('aria-label','Újrajátszás'); ov.classList.remove('hide');
    return;
  }
  render(clock); requestAnimationFrame(loop);
}
function togglePause(){
  if(!running||!AC) return;
  if(AC.state==='running'){AC.suspend();paused=true}else{AC.resume();paused=false}
}
function resize(){
  const r=cv.getBoundingClientRect();
  SC=clamp(r.width*(window.devicePixelRatio||1)/W,.6,1.5);
  for(const k of [cv,bufA,bufB]){k.width=Math.round(W*SC);k.height=Math.round(H*SC)}
  if(!running) started?render(Math.min(clock,DUR-.001)):render(5.75,true);
}
playBtn.addEventListener('click',start);
cv.addEventListener('click',togglePause);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();running?togglePause():start()}});
addEventListener('resize',resize);
resize();
</script>
